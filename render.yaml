services:
  - type: web
    name: dashboard-vendas
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TURSO_DATABASE_URL
        sync: false   # você preenche no painel
      - key: TURSO_AUTH_TOKEN
        sync: false